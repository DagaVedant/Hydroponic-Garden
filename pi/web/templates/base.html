<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<title>{% block title %}Tower{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">Vertical Hydroponic Tower <span>&middot; 16 plants</span></h1>
    <nav aria-label="Views">
      <a href="/" {% if page == 'overview' %}aria-current="page"{% endif %}>Overview</a>
      <a href="/timeline" {% if page == 'timeline' %}aria-current="page"{% endif %}>Timeline</a>
    </nav>
    <span class="link" id="link" aria-live="polite">Connecting</span>
  </header>

  <div class="status" id="status" role="status" aria-live="polite">
    <h2 id="status-head">Loading</h2>
    <span class="detail" id="status-detail"></span>
    <span class="when" id="status-when"></span>
  </div>

  {% block content %}{% endblock %}
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block script %}{% endblock %}
</body>
</html>
